name = "zynex-nex"
main = "worker.js"
compatibility_date = "2026-11-08"

[vars]
# استبدل بعنوان موقعك المنشور على Pages، دون / في النهاية.
ALLOWED_ORIGIN = "https://YOUR-ZYNEX-SITE-DOMAIN"

# تضمين ملف قاعدة المعرفة النصي داخل Worker وقت النشر.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true
