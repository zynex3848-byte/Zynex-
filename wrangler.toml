name = "zynex-nex"
main = "worker.js"
compatibility_date = "2026-11-08"

# جميع ملفات الموقع موجودة في المجلد الرئيسي نفسه.
# يمر كل طلب عبر Worker أولاً حتى تبقى ملفات المعرفة والإعدادات محمية.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# تضمين قاعدة المعرفة النصية داخل Worker وقت النشر.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true
